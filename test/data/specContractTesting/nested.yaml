# Nested resources behind a { meta, data } envelope, a typed reference (entityId + entityType),
# an optional parameter with a placeholder example, and requests whose ids cannot be linked.
openapi: 3.0.0
info:
  title: Nested
  version: '1'
paths:
  /specifications:
    post:
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
  /specifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      parameters:
        - name: limit
          in: query
          schema:
            type: string
          example: pageLimit
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
    delete:
      responses:
        '200':
          description: deleted
  /tasks:
    get:
      parameters:
        - name: entityId
          in: query
          schema:
            type: string
          example: '{{entityId}}'
        - name: entityType
          in: query
          schema:
            type: string
          example: specification
        - name: type
          in: query
          required: true
          schema:
            type: string
          example: collection-generation
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
  /tasks/{taskId}:
    get:
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
  /specifications/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
  /specifications/{id}/files/{fileId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
    delete:
      responses:
        '200':
          description: deleted
  /specs/{id}/files:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
