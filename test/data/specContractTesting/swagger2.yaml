swagger: '2.0'
info:
  title: Swagger 2.0 store
  version: 1.0.0
host: localhost:4010
basePath: /
schemes: [http]
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  apiKey:
    type: apiKey
    in: header
    name: x-api-key
security:
  - apiKey: []
paths:
  /stores:
    post:
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, example: Main street }
      responses:
        '201':
          description: created
          schema:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
  /stores/{storeId}:
    parameters:
      - { name: storeId, in: path, required: true, type: integer }
    get:
      responses:
        '200':
          description: ok
          schema:
            type: object
            properties:
              id: { type: integer }
    delete:
      responses:
        '204': { description: deleted }
